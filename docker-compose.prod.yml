# Production stack for the single-VPS deployment (PRD 07, "Database, deployment
# and monitoring"). The host pulls this image and restarts; it never builds.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# APION_IMAGE is set by the deploy workflow to the exact tag it pushed, so a
# rollback is the same command with an older tag.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apion}
    volumes:
      # Postgres 18 keeps its data in a major-version subdirectory, so the mount
      # goes one level above where earlier images wanted it.
      - postgres-data:/var/lib/postgresql
    # PRD 07 budgets Postgres about 200 MB of the host's 1 GB. These are safety
    # controls, not tuning preferences.
    command: >
      postgres
      -c shared_buffers=160MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c max_parallel_workers=0
      -c max_parallel_workers_per_gather=0
      -c jit=off
      -c statement_timeout=15000
      -c idle_in_transaction_session_timeout=30000
      -c autovacuum_max_workers=1
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-apion} -d ${POSTGRES_DB:-apion}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs to completion before the API starts, so a migration that fails fails
  # the deploy instead of leaving the API to crash-loop.
  migrate:
    image: ${APION_IMAGE:?set APION_IMAGE to the tag to deploy}
    restart: 'no'
    command: ['bun', '--smol', 'migrate.js']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-apion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apion}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  api:
    image: ${APION_IMAGE:?set APION_IMAGE to the tag to deploy}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-apion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apion}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Bound to loopback: terminate TLS with a reverse proxy on the host rather
    # than exposing the API directly.
    ports:
      - '127.0.0.1:${APION_PORT:-3000}:3000'
    mem_limit: 512m

volumes:
  postgres-data:
