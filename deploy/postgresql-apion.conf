# Install to /etc/postgresql/18/main/conf.d/apion.conf, then restart postgresql.
#
# These are the values docker-compose.yml passes the development container.
# PRD 07 makes them mandatory safety controls, not tuning preferences: the host
# has 1 GB and Postgres is budgeted about 200 MB of it.

shared_buffers = 160MB
work_mem = 4MB
maintenance_work_mem = 32MB
max_connections = 20
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
jit = off
statement_timeout = 15000
idle_in_transaction_session_timeout = 30000
autovacuum_max_workers = 1

# Nothing outside this host talks to Postgres; the API connects over loopback.
listen_addresses = 'localhost'
