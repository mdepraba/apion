name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # PRD 07: builds happen in CI and the host only pulls and restarts, so the
    # 1 GB target never has to compile anything.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: apion
          POSTGRES_PASSWORD: apion
          POSTGRES_DB: apion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apion -d apion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          # Nx compares against the base commit to decide what is affected.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun installs and runs the API, but Nx, esbuild and Vitest still spawn
      # node for their own work, so the runtime has to be on the box.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The route tree and TS project references are generated, so a stale
      # commit of either should fail here rather than surprise someone locally.
      - name: Check the workspace is in sync
        run: bunx nx sync:check

      - name: Check module boundaries
        run: bun run boundaries

      - name: Lint and format
        run: bunx nx run-many -t check

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Test
        run: bunx nx run-many -t test

      - name: Build
        run: bunx nx run-many -t build

      - name: Apply migrations against a real Postgres
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://apion:apion@localhost:5432/apion

  # PRD 08 lists "host builds exhaust memory" as a risk, so everything is built
  # here and the VPS only receives files and restarts a unit. The host is an LXC
  # container, where Docker cannot start a container at all, so the API runs
  # under systemd rather than in an image.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Attach required reviewers or branch rules to this environment to gate the
    # deploy without touching this file.
    permissions:
      contents: read
    environment: production
    # Never let two deploys interleave on one host; a queued one waits.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/srv/apion' }}
      RELEASE: ${{ github.sha }}
      HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Nx, esbuild and Vite spawn node even though the API runs on bun.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Build the release
        run: |
          bunx nx run @apion/api:build:production
          bunx nx run @apion/api:migrate
          bunx nx run @apion/web:build

      - name: Stage the release
        run: |
          mkdir -p release
          cp apps/api/dist/main.js release/main.js
          cp apps/api/dist-migrate/migrate.js release/migrate.js
          cp -r apps/web/dist release/web
          cp -r libs/db/migrations release/migrations
          # The bundle is ESM; bun needs the manifest to say so.
          echo '{"type":"module"}' > release/package.json

          # esbuild leaves third-party imports external, so the host needs them.
          # Workspace libraries are bundled into main.js and never resolved
          # there, but bun still wants every manifest to resolve the lockfile.
          mkdir -p proddeps
          cp package.json bun.lock proddeps/
          rsync -R apps/*/package.json libs/*/package.json proddeps/

          # --linker=hoisted is load-bearing. bun's default isolated layout
          # fills node_modules with ABSOLUTE symlinks into its .bun store, and
          # every one of them dangles the moment the tree is moved or rsynced
          # to another path. Hoisted writes real directories instead.
          (cd proddeps && bun install --frozen-lockfile --production --linker=hoisted)

          # The only absolute symlinks hoisted leaves. Nothing resolves them at
          # runtime because these are bundled into main.js.
          rm -rf proddeps/node_modules/@apion
          mv proddeps/node_modules release/node_modules

          du -sh release

      - name: Authorise the host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.VPS_HOST }}
            Port ${{ vars.VPS_SSH_PORT || '22' }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      # Into a release directory of its own, so the running one is untouched
      # until the symlink swap below.
      - name: Ship the release
        run: |
          ssh "$HOST" "mkdir -p '$APP_DIR/releases/$RELEASE'"
          rsync -az --delete release/ "$HOST:$APP_DIR/releases/$RELEASE/"

      - name: Migrate, then switch and restart
        run: |
          ssh "$HOST" bash -euo pipefail <<EOF
          set -a; . '$APP_DIR/.env'; set +a
          cd '$APP_DIR/releases/$RELEASE'

          # A failed migration leaves the old release running and fails the
          # deploy, rather than restarting the API against a schema it cannot
          # use.
          MIGRATIONS_FOLDER=./migrations /usr/local/bin/bun --smol migrate.js

          # ln then mv, because a plain 'ln -sfn' over an existing symlink is
          # not atomic and can leave 'current' missing between the two calls.
          ln -sfn '$APP_DIR/releases/$RELEASE' '$APP_DIR/current.next'
          mv -T '$APP_DIR/current.next' '$APP_DIR/current'

          sudo systemctl restart apion.service
          EOF

      - name: Wait for the API to report healthy
        run: |
          ssh "$HOST" bash -euo pipefail <<EOF
          set -a; . '$APP_DIR/.env'; set +a

          for _ in \$(seq 1 40); do
            if curl -fsS "http://127.0.0.1:\${PORT:-3000}/health" | grep -q '"status":"ok"'; then
              echo 'API is healthy.'
              exit 0
            fi
            sleep 3
          done

          echo 'API did not report healthy.'
          systemctl status apion.service --no-pager || true
          journalctl -u apion.service -n 80 --no-pager || true
          exit 1
          EOF

      # A 1 GB host fills up fast when every deploy leaves a node_modules behind.
      - name: Drop superseded releases
        if: success()
        run: |
          ssh "$HOST" bash -euo pipefail <<EOF
          cd '$APP_DIR/releases'
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Kept: \$(ls -1dt */ | tr '\n' ' ')"
          EOF
