name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # PRD 07: builds happen in CI and the host only pulls and restarts, so the
    # 1 GB target never has to compile anything.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: apion
          POSTGRES_PASSWORD: apion
          POSTGRES_DB: apion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apion -d apion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          # Nx compares against the base commit to decide what is affected.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The route tree and TS project references are generated, so a stale
      # commit of either should fail here rather than surprise someone locally.
      - name: Check the workspace is in sync
        run: pnpm nx sync:check

      - name: Check module boundaries
        run: pnpm boundaries

      - name: Lint and format
        run: pnpm nx run-many -t check

      - name: Typecheck
        run: pnpm nx run-many -t typecheck

      - name: Test
        run: pnpm nx run-many -t test

      - name: Build
        run: pnpm nx run-many -t build

      - name: Apply migrations against a real Postgres
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://apion:apion@localhost:5432/apion
